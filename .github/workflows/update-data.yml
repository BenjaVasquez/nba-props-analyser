name: Actualizar datos NBA

on:
  schedule:
    # Horas en UTC. Chile (UTC-3): 06:20, 12:20, 15:20, 18:20 y 20:20.
    # La primera trae resultados y box scores de la noche; las demás refrescan lesionados.
    - cron: "20 9,15,18,21,23 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y procesar datos
        run: python scripts/update_data.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "nba-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git commit -m "Datos NBA $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
