<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA Props Analyser</title>
  <meta name="theme-color" content="#020617">
  <meta name="description" content="Calendario, plantillas, props y parlays de la NBA con datos diarios.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">NBA <span>PROPS</span> ANALYSER</div>
    <div class="top-right">
      <button class="btn-track live-btn" id="btnLive" type="button" title="Marcador de todos los partidos y tus parlays en vivo">🔴 En vivo</button>
      <button class="btn-track" id="btnBets" type="button" title="Cargar tu apuesta, armar parlays con filtros y seguirlos">🎟 Mis apuestas</button>
      <button class="btn-track" id="btnTracking" type="button" title="Rendimiento real de los picks guardados antes de cada partido">📈 Registro</button>
      <div class="meta" id="meta">Cargando datos…</div>
    </div>
  </header>

  <main class="layout">
    <!-- ============ COLUMNA 1: CALENDARIO ============ -->
    <aside class="col col-calendar" aria-label="Calendario de partidos">
      <div class="cal-toolbar">
        <div class="cal-title-row">
          <h2>Calendario</h2>
          <span class="cal-actions">
            <button class="btn-parlays" id="btnDayParlays" type="button" title="Parlays con los partidos del día visible">🎯 Parlays del día</button>
            <button class="btn-today" id="btnToday" type="button">Hoy</button>
          </span>
        </div>

        <div class="week">
          <button class="week-nav" id="weekPrev" type="button" aria-label="Semana anterior">‹</button>
          <div class="week-days" id="weekDays"></div>
          <button class="week-nav" id="weekNext" type="button" aria-label="Semana siguiente">›</button>
        </div>

        <div class="filters">
          <select id="teamFilter" aria-label="Filtrar por equipo">
            <option value="ALL">Todos los equipos</option>
          </select>
          <div class="seg" role="tablist" aria-label="Estado">
            <button type="button" data-status="all" class="on">Todos</button>
            <button type="button" data-status="upcoming">Próximos</button>
            <button type="button" data-status="final">Finales</button>
          </div>
        </div>
        <div class="team-strip" id="teamStrip" hidden></div>
      </div>

      <div class="cal-list" id="calList" tabindex="-1">
        <div class="empty">Cargando calendario…</div>
      </div>
    </aside>

    <!-- ============ COLUMNA 2: PLANTILLAS (próximo paso) ============ -->
    <section class="col col-roster" aria-label="Plantillas">
      <div class="roster-top">
        <input class="search" id="rosterSearch" type="search" placeholder="Buscar jugador…" autocomplete="off">
        <div class="roster-head" id="rosterHead"></div>
      </div>
      <div class="roster-list" id="rosterList"></div>
    </section>

    <!-- ============ COLUMNA 3: ANÁLISIS ============ -->
    <section class="col col-analysis" aria-label="Análisis">
      <div class="props" id="propTabs" aria-label="Tipo de prop">
        <button type="button" data-stat="pts" class="on">Points</button><button type="button" data-stat="ast">Assists</button>
        <button type="button" data-stat="reb">Rebounds</button><button type="button" data-stat="tpm">Threes</button>
        <button type="button" data-stat="pts_ast">Pts+Ast</button><button type="button" data-stat="pts_reb">Pts+Reb</button>
        <button type="button" data-stat="reb_ast">Reb+Ast</button><button type="button" data-stat="pra">Pts+Reb+Ast</button>
        <button type="button" data-stat="stl">Steals</button><button type="button" data-stat="blk">Blocks</button>
        <button type="button" data-stat="dd2">Double-Double</button><button type="button" data-stat="dd3">Triple-Double</button>
      </div>
      <div id="matchup"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
